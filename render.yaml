# Worker WhatsApp (proses persisten). Vercel hanya menjalankan frontend + API publik.
# Secret TIDAK ditulis di sini. Isi di dashboard Render (sync: false).
services:
  - type: worker
    name: zynder-whatsapp-worker
    runtime: node
    plan: starter
    buildCommand: npm install --legacy-peer-deps
    startCommand: npx tsx whatsapp-worker.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_WORKER_SECRET
        sync: false
      - key: WHATSAPP_SESSIONS_DIR
        value: /var/data/sessions
    disk:
      name: whatsapp-sessions
      mountPath: /var/data
      sizeGB: 1
